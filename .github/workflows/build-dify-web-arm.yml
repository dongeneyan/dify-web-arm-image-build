name: Build Dify Web ARM64 (GHCR)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 【关键步骤】自动解压你上传的 ZIP 包
      # 如果你的 ZIP 包名字变了，请修改下面的 *.zip
      - name: Unzip Source Code
        run: |
          unzip -o dify-1.11.4.zip -d ./dify-source
          ls ./dify-source  # 打印目录确认解压成功

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ARM64 Image
        uses: docker/build-push-action@v5
        with:
          context: ./dify-source/api  # ⚠️注意：这里指向解压后的文件夹路径
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dify-api-arm64:latest
            ghcr.io/${{ github.repository_owner }}/dify-api-arm64:1.11.4
