name: Build Dify Web ARM64 (GHCR)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 【关键步骤】自动解压你上传的 ZIP 包
      - name: Unzip Source Code
        run: |
          unzip -o dify-1.11.4.zip -d ./dify-source
          ls ./dify-source  # 打印目录确认解压成功

      # 【核心修复】自动在 Dockerfile 中注入国内镜像源
      - name: Fix Dockerfile Registry
        run: |
          DOCKERFILE="./dify-source/dify-1.11.4/web/Dockerfile"
          
          # 在 pnpm install 和 pnpm add -g pm2 前面插入换源命令
          sed -i '/^RUN.*pnpm install/i RUN pnpm config set registry https://registry.npmmirror.com' "$DOCKERFILE"
          sed -i '/^RUN.*pnpm add -g pm2/i RUN pnpm config set registry https://registry.npmmirror.com' "$DOCKERFILE"

          echo "Dockerfile patched successfully."
          cat "$DOCKERFILE" | grep -A 2 "registry"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ARM64 Image
        uses: docker/build-push-action@v6
        with:
          context: ./dify-source/dify-1.11.4/web  # 指向解压后的文件夹路径
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dify-web-arm64:latest
            ghcr.io/${{ github.repository_owner }}/dify-web-arm64:1.11.4
