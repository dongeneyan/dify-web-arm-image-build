name: Build Dify Web ARM64 Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest-arm64 # 使用原生 ARM64 运行器，速度最快且无需模拟
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive # 重要：Dify 包含子模块，必须递归拉取

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Dify Web
        run: |
          cd web
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ${{ secrets.DOCKER_USERNAME }}/dify-web-arm64:1.11.4 \
            .
