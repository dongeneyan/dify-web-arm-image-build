name: Build Dify Web ARM64 (GHCR)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许手动点击按钮触发
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          unzip -o dify-1.11.4.zip -d ./dify-source
          ls ./dify-source

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ shturl.cc/Rc }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ARM64 Image
        uses: docker/build-push-action@v6 # ✅ v6 消除 Node20 警告
        with:
          context: ./dify-source/dify-1.11.4/web
          platforms: linux/arm64
          push: true
          progress: plain # ✅ 输出完整构建日志，查看pnpm真实报错
          tags: |
            ghcr.io/${{ github.repository_owner }}/dify-web-arm64:latest
            ghcr.io/${{ github.repository_owner }}/dify-web-arm64:1.11.4
